{% extends "base.html" %}
{% block title %}Register - Peak Mist{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4 text-center">Create a Trekker Account</h3>
                    <p class="text-muted text-center">
                        Registration is only for trekkers. Staff accounts are
                        created by the Admin.
                    </p>
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="mb-3">
                            <label for="full_name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="full_name"
                                   name="full_name" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username"
                                   name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email"
                                   name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phone" name="phone">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password"
                                   name="password" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password"
                                   name="confirm_password" required>
                        </div>
                        <button type="submit" class="btn btn-trek w-100">Register</button>
                    </form>
                    <p class="text-center mt-3 mb-1">
                        Already have an account?
                        <a href="{{ url_for('auth.login') }}">Login here</a>
                    </p>
                    <p class="text-center mb-0">
                        Are you a trek guide?
                        <a href="{{ url_for('auth.register_staff') }}">Register as Trek Staff</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
