{% extends "base.html" %}
{% block title %}Login - Peak Mist{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4 text-center">Login</h3>
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label for="role" class="form-label">Login as</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="user" selected>Trekker (User)</option>
                                <option value="staff">Trek Staff</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username"
                                   name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password"
                                   name="password" required>
                        </div>
                        <button type="submit" class="btn btn-trek w-100">Login</button>
                    </form>
                    <p class="text-center mt-3 mb-1">
                        New trekker?
                        <a href="{{ url_for('auth.register') }}">Create an account</a>
                    </p>
                    <p class="text-center mb-0">
                        Want to join as Trek Staff?
                        <a href="{{ url_for('auth.register_staff') }}">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
