{% extends "layout_dashboard.html" %}
{% set active_page = 'profile' %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<h2 class="mb-4">Edit Your Profile</h2>
<div class="card shadow-sm">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('staff.edit_profile') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username"
                       value="{{ staff.username }}" required>
            </div>
            <div class="mb-3">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="full_name" name="full_name"
                       value="{{ staff.full_name }}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       value="{{ staff.email }}" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="phone" name="phone"
                       value="{{ staff.phone or '' }}">
            </div>
            <div class="mb-3">
                <label for="experience_years" class="form-label">Experience (years)</label>
                <input type="number" min="0" max="60" class="form-control" id="experience_years" name="experience_years"
                       value="{{ staff.staff_profile.details.experience_years if staff.staff_profile and staff.staff_profile.details and staff.staff_profile.details.experience_years is not none else '' }}">
                <div class="form-text">Shown to trekkers on treks you're assigned to guide.</div>
            </div>
            <button type="submit" class="btn btn-trek">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
