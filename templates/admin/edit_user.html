{% extends "layout_dashboard.html" %}
{% set active_page = 'users' %}
{% block title %}Edit User{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Edit User: {{ user.full_name }}</h2>
    <a href="{{ url_for('admin.users_list') }}" class="btn btn-outline-secondary">&larr; Back to Users</a>
</div>
<div class="card shadow-sm">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('admin.edit_user', user_id=user.id) }}">
            <div class="mb-3">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="full_name" name="full_name"
                       value="{{ user.full_name }}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       value="{{ user.email }}" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="phone" name="phone"
                       value="{{ user.phone or '' }}">
            </div>
            <button type="submit" class="btn btn-trek">Save Changes</button>
            <a href="{{ url_for('admin.users_list') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
